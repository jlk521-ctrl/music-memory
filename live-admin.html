<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Live Testing Admin — Music Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#122341; --navy-deep:#0a1526; --navy-text:#1d5099;
    --parchment:#f2efe6; --orange:#d97e2c; --orange-bright:#f0b83e;
    --ink:#1c1712; --good:#2f6b4a; --bad:#b3402f;
    --display:'Fraunces', serif; --body:'Libre Caslon Text', serif;
  }
  *{ box-sizing:border-box; }
  html{ color-scheme:light; }
  body{ margin:0; background:var(--parchment); color:var(--ink); font-family:var(--body); line-height:1.5; }
  button{ font-family:var(--body); cursor:pointer; }
  input, select{ font-family:var(--body); }

  .hero{ background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); color:var(--parchment); padding:36px 24px; text-align:center; }
  .hero h1{ font-family:var(--display); font-style:italic; font-weight:600; margin:0 0 4px; font-size:1.8rem; }
  .hero p{ margin:0; color:rgba(241,231,208,0.75); font-size:0.9rem; }

  main{ max-width:900px; margin:0 auto; padding:32px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(18,35,65,0.12); border-radius:6px; padding:22px; margin-bottom:24px; box-shadow:0 14px 30px -18px rgba(0,0,0,0.25); }
  .login-card{ max-width:360px; margin:60px auto; text-align:center; }
  .btn{ background:var(--navy); color:var(--parchment); border:none; padding:10px 22px; border-radius:30px; font-size:0.9rem; }
  .btn:hover{ background:var(--navy-deep); }
  .btn.danger{ background:var(--bad); }
  .btn.secondary{ background:transparent; color:var(--navy); border:1px solid var(--navy); }
  .btn.small{ padding:6px 14px; font-size:0.82rem; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  h2.section-title{ font-family:var(--display); font-style:italic; color:var(--navy-text); font-size:1.3rem; margin:0 0 14px; }
  #signoutBar{ display:flex; justify-content:flex-end; padding:12px 20px 0; max-width:900px; margin:0 auto; }
  .status-msg{ font-size:0.85rem; color:#8a7a63; margin-top:8px; }

  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab-btn{ background:#fff; border:1px solid rgba(18,35,65,0.2); padding:8px 18px; border-radius:20px; font-size:0.88rem; }
  .tab-btn.active{ background:var(--navy); color:var(--parchment); border-color:var(--navy); }

  /* Drag-and-drop order list */
  .order-list{ list-style:none; margin:0 0 16px; padding:0; }
  .order-item{
    display:flex; align-items:center; gap:10px;
    background:var(--parchment); border:1px solid rgba(18,35,65,0.15); border-radius:4px;
    padding:10px 12px; margin-bottom:6px; cursor:grab;
  }
  .order-item.dragging{ opacity:0.4; }
  .order-item .handle{ color:#8a7a63; font-size:1.1rem; }
  .order-item .piece-name{ flex-grow:1; font-weight:700; }
  .order-item input[type=number]{ width:64px; padding:4px 6px; border:1px solid rgba(18,35,65,0.25); border-radius:4px; }
  .order-item label{ font-size:0.75rem; color:#8a7a63; }

  .template-row, .run-row{
    display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(18,35,65,0.1); flex-wrap:wrap;
  }
  .template-row:last-child, .run-row:last-child{ border-bottom:none; }
  .template-row .info, .run-row .info{ flex-grow:1; }
  .join-code{ font-family:var(--display); font-style:italic; font-size:1.6rem; color:var(--orange); letter-spacing:0.1em; }

  .live-control{ text-align:center; }
  .track-badge{ font-family:var(--display); font-style:italic; font-size:1.6rem; color:var(--navy); background:#efe9da; border-radius:50%; width:70px; height:70px; line-height:70px; margin:0 auto 12px; }
  .traffic-light{
    font-family:var(--display); font-style:italic; font-size:1.5rem;
    border-radius:50%; width:70px; height:70px; line-height:70px;
    margin:0 auto 12px; transition:background-color 0.3s ease, color 0.3s ease;
    background:#2ecc55; color:#000;
  }
  .traffic-light.yellow{ background:#f4d35e; color:#000; }
  .traffic-light.red{ background:#e6392b; color:#fff; }
  .play-btn{ background:var(--navy); color:var(--parchment); border:none; padding:14px 28px; border-radius:30px; font-size:1rem; margin-bottom:10px; }
  .play-btn:disabled{ opacity:0.5; }

  .results-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(18,35,65,0.1); font-size:0.88rem; }
  .results-row .mark.correct{ color:var(--good); }
  .results-row .mark.incorrect{ color:var(--bad); }
  .results-row .score{ font-family:var(--display); font-style:italic; color:var(--orange); min-width:50px; text-align:right; }
</style>
</head>
<body>

<header class="hero">
  <h1>Live Testing Admin</h1>
  <p>Build templates, run live sessions, review and post results</p>
</header>

<div id="signoutBar"></div>
<main id="app"></main>

<div id="ytHolder" style="position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;">
  <div id="ytPlayer"></div>
</div>

<script>
  window.ytApiReady = false;
  window.onYouTubeIframeAPIReady = function(){ window.ytApiReady = true; };
</script>
<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { initializeFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, updateDoc, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC1buaseorV5ZMvicSbYrzx3tz7_tos_wQ",
    authDomain: "music-memory-490d4.firebaseapp.com",
    projectId: "music-memory-490d4",
    storageBucket: "music-memory-490d4.firebasestorage.app",
    messagingSenderId: "669104332511",
    appId: "1:669104332511:web:6e15026013e67de445536a"
  };
  const app = initializeApp(firebaseConfig);
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  const ADMIN_EMAILS = ["jonathan.ochoa@saisd.org", "jlk521@gmail.com"];

  const TOTAL_PIECES = 10;
  const CLIP_SECONDS = 20;
  const OFFICIAL_POINTS_PER_FIELD = 33.33;

  const appEl = document.getElementById("app");
  const signoutBarEl = document.getElementById("signoutBar");

  /* ============================================
     AUTH
     ============================================ */
  onAuthStateChanged(auth, (user) => {
    if (user && ADMIN_EMAILS.includes(user.email)) {
      signoutBarEl.innerHTML = `<span style="font-size:0.85rem;color:#8a7a63;margin-right:10px;align-self:center;">Signed in as ${user.email}</span><button class="btn small" id="signOutBtn">Sign Out</button>`;
      document.getElementById("signOutBtn").addEventListener("click", () => signOut(auth));
      renderTabs();
    } else if (user) {
      signoutBarEl.innerHTML = "";
      appEl.innerHTML = `<div class="card login-card"><h2 class="section-title">Not Authorized</h2><p class="status-msg">Signed in as ${user.email}, but this account isn't on the admin list.</p></div>`;
      signOut(auth);
    } else {
      signoutBarEl.innerHTML = "";
      renderLogin();
    }
  });

  function renderLogin(){
    appEl.innerHTML = `
      <div class="card login-card">
        <h2 class="section-title">Admin Sign In</h2>
        <button class="btn" id="googleSignInBtn" style="width:100%;">Sign in with Google</button>
        <p class="status-msg" id="loginStatus"></p>
      </div>
    `;
    document.getElementById("googleSignInBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("loginStatus");
      statusEl.textContent = "Opening Google sign-in\u2026";
      try { await signInWithPopup(auth, googleProvider); }
      catch (err) { statusEl.textContent = "Sign-in failed: " + err.message; }
    });
  }

  /* ============================================
     TABS
     ============================================ */
  let activeTab = "templates";
  let activeRunCode = null;

  function renderTabs(){
    appEl.innerHTML = `
      <div class="tabs">
        <button class="tab-btn ${activeTab === 'templates' ? 'active' : ''}" data-tab="templates">Templates</button>
        <button class="tab-btn ${activeTab === 'runs' ? 'active' : ''}" data-tab="runs">Runs</button>
      </div>
      <div id="tabContent"></div>
    `;
    appEl.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => { activeTab = btn.dataset.tab; renderTabs(); });
    });
    if (activeTab === "templates") renderTemplatesTab();
    else renderRunsTab();
  }

  /* ============================================
     PIECE DATA (for building templates)
     ============================================ */
  async function fetchAllPieceInfo(){
    const [composerSnap, titleSnap, audioSnap] = await Promise.all([
      getDocs(collection(db, "pieces_composer")),
      getDocs(collection(db, "pieces_titles")),
      getDocs(collection(db, "pieces_audio"))
    ]);
    const composers = {}, titles = {}, audio = {};
    composerSnap.forEach(d => composers[d.id] = d.data().composer);
    titleSnap.forEach(d => titles[d.id] = d.data());
    audioSnap.forEach(d => audio[d.id] = d.data());
    const pieces = {};
    for (let i = 1; i <= TOTAL_PIECES; i++){
      const id = String(i);
      pieces[id] = { composer: composers[id], majorWork: titles[id]?.majorWork, selectionTitle: titles[id]?.selectionTitle || "", videoId: audio[id]?.videoId, musicStart: audio[id]?.musicStart || 0, musicEnd: audio[id]?.musicEnd || CLIP_SECONDS };
    }
    return pieces;
  }

  /* ============================================
     TEMPLATES TAB
     ============================================ */
  async function renderTemplatesTab(){
    const content = document.getElementById("tabContent");
    content.innerHTML = `<div class="card"><p class="status-msg">Loading\u2026</p></div>`;

    const pieces = await fetchAllPieceInfo();
    let templatesSnap;
    try { templatesSnap = await getDocs(collection(db, "live_templates")); }
    catch (err) { content.innerHTML = `<div class="card"><p class="status-msg">Couldn't load templates: ${err.message}</p></div>`; return; }
    const templates = [];
    templatesSnap.forEach(d => templates.push({ id: d.id, ...d.data() }));

    content.innerHTML = `
      <div class="card">
        <h2 class="section-title">Saved Templates</h2>
        ${templates.length === 0 ? `<p class="status-msg">No templates yet — build one below.</p>` : templates.map(t => `
          <div class="template-row">
            <div class="info"><strong>${t.name}</strong> <span style="color:#8a7a63;font-size:0.85rem;">(${t.order.length} tracks)</span></div>
            <button class="btn small danger" data-action="delete-template" data-id="${t.id}">Delete</button>
          </div>
        `).join("")}
      </div>
      <div class="card">
        <h2 class="section-title">Build a New Template</h2>
        <button class="btn small" id="randomizeBtn" style="margin-bottom:14px;">Randomize Order, Segments &amp; Name</button>
        <input type="text" id="templateName" placeholder="Template name (e.g. 'Fall Test A')" style="width:100%;padding:8px;margin-bottom:14px;border:1px solid rgba(18,35,65,0.25);border-radius:4px;">
        <p style="font-size:0.85rem;color:#8a7a63;margin-bottom:10px;">Drag to reorder. Segment start/end are pre-filled from the practice data — adjust to lock in exact seconds for this template.</p>
        <ul class="order-list" id="orderList"></ul>
        <button class="btn" id="saveTemplateBtn">Save Template</button>
        <p class="status-msg" id="templateStatus"></p>
      </div>
    `;

    content.querySelectorAll('[data-action="delete-template"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this template?")) return;
        await deleteDoc(doc(db, "live_templates", btn.dataset.id));
        renderTemplatesTab();
      });
    });

    // Build the draggable order list, starting in piece-ID order 1..10
    let workingOrder = Array.from({length: TOTAL_PIECES}, (_, i) => String(i + 1));
    renderOrderList(workingOrder, pieces);

    document.getElementById("randomizeBtn").addEventListener("click", () => {
      const shuffled = Array.from({length: TOTAL_PIECES}, (_, i) => String(i + 1));
      for (let i = shuffled.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      const randomizedPieces = {};
      Object.keys(pieces).forEach(id => {
        const p = pieces[id];
        const latestStart = Math.max(p.musicStart, p.musicEnd - CLIP_SECONDS);
        const start = latestStart <= p.musicStart ? p.musicStart : Math.floor(p.musicStart + Math.random() * (latestStart - p.musicStart));
        randomizedPieces[id] = { ...p, musicStart: start, musicEnd: start + CLIP_SECONDS };
      });
      renderOrderList(shuffled, randomizedPieces);
      document.getElementById("templateName").value = suggestedTemplateName();
    });

    document.getElementById("saveTemplateBtn").addEventListener("click", async () => {
      const name = document.getElementById("templateName").value.trim();
      const statusEl = document.getElementById("templateStatus");
      if (!name) { statusEl.textContent = "Please name this template."; return; }
      const segments = {};
      document.querySelectorAll(".order-item").forEach(li => {
        const id = li.dataset.id;
        segments[id] = {
          start: Number(li.querySelector('[data-field="start"]').value),
          end: Number(li.querySelector('[data-field="end"]').value)
        };
      });
      const finalOrder = Array.from(document.querySelectorAll(".order-item")).map(li => li.dataset.id);
      statusEl.textContent = "Saving\u2026";
      try {
        await setDoc(doc(collection(db, "live_templates")), { name, order: finalOrder, segments, createdAt: Date.now() });
        statusEl.textContent = "Saved!";
        renderTemplatesTab();
      } catch (err) {
        statusEl.textContent = "Couldn't save: " + err.message;
      }
    });

    function renderOrderList(order, pieces){
      const listEl = document.getElementById("orderList");
      listEl.innerHTML = order.map(id => `
        <li class="order-item" draggable="true" data-id="${id}">
          <span class="handle">\u2630</span>
          <span class="piece-name">${pieces[id].composer} \u2014 ${pieces[id].majorWork}</span>
          <label>Start <input type="number" data-field="start" value="${pieces[id].musicStart}"></label>
          <label>End <input type="number" data-field="end" value="${pieces[id].musicEnd}"></label>
        </li>
      `).join("");
      wireDragAndDrop(listEl);
    }

    function wireDragAndDrop(listEl){
      let dragEl = null;
      listEl.querySelectorAll(".order-item").forEach(item => {
        item.addEventListener("dragstart", () => { dragEl = item; item.classList.add("dragging"); });
        item.addEventListener("dragend", () => { item.classList.remove("dragging"); });
        item.addEventListener("dragover", (e) => {
          e.preventDefault();
          const after = getDragAfterElement(listEl, e.clientY);
          if (after == null) { listEl.appendChild(dragEl); }
          else { listEl.insertBefore(dragEl, after); }
        });
      });
    }

    function getDragAfterElement(container, y){
      const items = [...container.querySelectorAll(".order-item:not(.dragging)")];
      return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) { return { offset, element: child }; }
        return closest;
      }, { offset: -Infinity }).element;
    }
  }

  /* ============================================
     RUNS TAB
     ============================================ */
  function ordinal(n){
    const s = ["th", "st", "nd", "rd"];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function suggestedTemplateName(){
    const now = new Date();
    const weekOfMonth = Math.ceil(now.getDate() / 7);
    const monthName = now.toLocaleString("default", { month: "long" });
    return `${ordinal(weekOfMonth)} Week of ${monthName}`;
  }

  function generateJoinCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0/I/1 to avoid confusion
    let code = "";
    for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  async function renderRunsTab(){
    const content = document.getElementById("tabContent");
    content.innerHTML = `<div class="card"><p class="status-msg">Loading\u2026</p></div>`;

    let templatesSnap, runsSnap;
    try {
      [templatesSnap, runsSnap] = await Promise.all([
        getDocs(collection(db, "live_templates")),
        getDocs(query(collection(db, "live_runs"), orderBy("createdAt", "desc")))
      ]);
    } catch (err) {
      content.innerHTML = `<div class="card"><p class="status-msg">Couldn't load: ${err.message}</p></div>`;
      return;
    }
    const templates = [];
    templatesSnap.forEach(d => templates.push({ id: d.id, ...d.data() }));
    const runs = [];
    runsSnap.forEach(d => runs.push({ id: d.id, ...d.data() }));

    if (activeRunCode) { return renderLiveControl(activeRunCode); }

    content.innerHTML = `
      <div class="card">
        <h2 class="section-title">Start a New Run</h2>
        ${templates.length === 0 ? `<p class="status-msg">Build a template first.</p>` : `
          <select id="templatePick" style="width:100%;padding:8px;margin-bottom:10px;">
            ${templates.map(t => `<option value="${t.id}">${t.name}</option>`).join("")}
          </select>
          <input type="text" id="runLabel" placeholder="Label (e.g. 'Period 3, Oct 15')" style="width:100%;padding:8px;margin-bottom:10px;">
          <button class="btn" id="startRunBtn">Create Run &amp; Get Join Code</button>
        `}
        <p class="status-msg" id="runStatus"></p>
      </div>
      <div class="card">
        <h2 class="section-title">Existing Runs</h2>
        ${runs.length === 0 ? `<p class="status-msg">No runs yet.</p>` : runs.map(r => `
          <div class="run-row">
            <div class="info"><strong>${r.label}</strong> <span style="color:#8a7a63;font-size:0.85rem;">${r.status} \u2014 code ${r.id}</span></div>
            <button class="btn small" data-action="open-run" data-id="${r.id}">Open</button>
            <button class="btn small danger" data-action="delete-run" data-id="${r.id}">Delete</button>
          </div>
        `).join("")}
      </div>
    `;

    if (templates.length > 0) {
      document.getElementById("startRunBtn").addEventListener("click", async () => {
        const templateId = document.getElementById("templatePick").value;
        const label = document.getElementById("runLabel").value.trim() || "Untitled Run";
        const statusEl = document.getElementById("runStatus");
        const code = generateJoinCode();
        statusEl.textContent = "Creating\u2026";
        try {
          await setDoc(doc(db, "live_runs", code), {
            templateId, label, status: "waiting", currentTrackIndex: -1, startedAt: null, createdAt: Date.now()
          });
          activeRunCode = code;
          renderRunsTab();
        } catch (err) {
          statusEl.textContent = "Couldn't create run: " + err.message;
        }
      });
    }

    content.querySelectorAll('[data-action="open-run"]').forEach(btn => {
      btn.addEventListener("click", () => { activeRunCode = btn.dataset.id; renderRunsTab(); });
    });

    content.querySelectorAll('[data-action="delete-run"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this run and all its student responses? This can't be undone.")) return;
        const code = btn.dataset.id;
        try {
          const respSnap = await getDocs(collection(db, "live_runs", code, "responses"));
          await Promise.all(respSnap.docs.map(d => deleteDoc(d.ref)));
          await deleteDoc(doc(db, "live_runs", code));
          renderRunsTab();
        } catch (err) {
          alert("Couldn't delete: " + err.message);
        }
      });
    });
  }

  /* ============================================
     LIVE CONTROL (a specific run, in progress)
     ============================================ */
  let ytPlayer = null, ytReady = false, playTimer = null;
  function initYTPlayer(){
    ytPlayer = new YT.Player("ytPlayer", {
      height: "1", width: "1",
      playerVars: { controls: 0, disablekb: 1, playsinline: 1 },
      events: { onReady: () => { ytReady = true; } }
    });
  }
  if (window.ytApiReady) { initYTPlayer(); } else { window.onYouTubeIframeAPIReady = initYTPlayer; }

  function playClip(videoId, startSeconds, onDone){
    if (!ytReady) { setTimeout(() => playClip(videoId, startSeconds, onDone), 300); return; }
    clearTimeout(playTimer);
    ytPlayer.loadVideoById({ videoId, startSeconds });
    playTimer = setTimeout(() => { ytPlayer.pauseVideo(); if (onDone) onDone(); }, CLIP_SECONDS * 1000);
  }

  async function renderLiveControl(code){
    const content = document.getElementById("tabContent");
    content.innerHTML = `<div class="card"><p class="status-msg">Loading run\u2026</p></div>`;

    const runSnap = await getDoc(doc(db, "live_runs", code));
    if (!runSnap.exists()) { content.innerHTML = `<div class="card"><p class="status-msg">Run not found.</p><button class="btn" id="backBtn">Back</button></div>`; document.getElementById("backBtn").addEventListener("click", () => { activeRunCode = null; renderRunsTab(); }); return; }
    const run = runSnap.data();
    const templateSnap = await getDoc(doc(db, "live_templates", run.templateId));
    const template = templateSnap.data();
    const pieces = await fetchAllPieceInfo();

    if (run.status === "finished") { return renderResultsReview(code, run, template, pieces); }

    const idx = run.currentTrackIndex;
    const currentPieceId = idx >= 0 ? template.order[idx] : null;
    const joinUrl = `https://jlk521-ctrl.github.io/music-memory/live-test.html?code=${code}`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(joinUrl)}`;

    content.innerHTML = `
      <div class="card live-control">
        <h2 class="section-title">${run.label}</h2>
        <p>Join code: <span class="join-code">${code}</span></p>
        <p style="font-size:0.85rem;color:#8a7a63;">Scan to join instantly, or go to the Live Test page and enter the code above.</p>
        <p><a href="https://jlk521-ctrl.github.io/music-memory/live-display.html?code=${code}" target="_blank" style="color:var(--navy-text);">Open Public Display &#8599;</a></p>
        ${idx < 0
          ? `<img src="${qrUrl}" alt="QR code to join this test" style="width:260px;height:260px;margin:0 auto 12px;display:block;">`
          : `<div class="track-badge">${idx + 1}</div>`
        }
        <p id="joinedCount" style="font-size:0.85rem;color:#8a7a63;">Loading joined count\u2026</p>
        ${idx >= 0 ? `<div class="traffic-light" id="trafficLight">40</div>` : ""}
        <p>${idx >= 0 ? `Now playing: <strong>${pieces[currentPieceId].composer} \u2014 ${pieces[currentPieceId].majorWork}</strong> (hidden from students)` : "Not started yet"}</p>
        <button class="play-btn" id="playBtn" ${idx < 0 ? "disabled" : ""}>Play Track ${idx >= 0 ? idx + 1 : ""}</button>
        <div style="margin-top:14px;">
          ${idx < 0
            ? `<button class="btn" id="beginBtn">Begin Run (Track 1)</button>`
            : idx < TOTAL_PIECES - 1
              ? `<button class="btn" id="nextBtn">Next Track \u2192</button>`
              : `<button class="btn" id="finishBtn">Finish Listening &amp; Close for Submissions</button>`
          }
        </div>
        <p class="status-msg" id="controlStatus"></p>
        <button class="btn secondary" id="backBtn" style="margin-top:16px;">Back to Runs</button>
      </div>
    `;

    document.getElementById("backBtn").addEventListener("click", () => { clearInterval(trafficLightInterval); activeRunCode = null; renderRunsTab(); });

    const joinedCountEl = document.getElementById("joinedCount");
    const unsubJoined = onSnapshot(collection(db, "live_runs", code, "responses"), (snap) => {
      if (joinedCountEl) joinedCountEl.textContent = `${snap.size} student${snap.size === 1 ? "" : "s"} joined so far`;
    }, () => { if (joinedCountEl) joinedCountEl.textContent = ""; });

    if (idx >= 0) {
      document.getElementById("playBtn").addEventListener("click", async (e) => {
        e.target.disabled = true;
        const seg = template.segments[currentPieceId];
        const updates = { currentPlayStartedAt: Date.now() };
        if (idx === TOTAL_PIECES - 1) {
          // Last track — record exactly when this playback starts, since
          // the completion-time tie-breaker now measures from here, not
          // from the very start of the whole run.
          updates.lastTrackPlayedAt = Date.now();
        }
        await updateDoc(doc(db, "live_runs", code), updates);
        startTrafficLight();
        playClip(pieces[currentPieceId].videoId, seg.start, () => { e.target.disabled = false; });
      });
    }

    let trafficLightInterval = null;
    function startTrafficLight(){
      clearInterval(trafficLightInterval);
      let elapsed = 0;
      const el = document.getElementById("trafficLight");
      const update = () => {
        if (!el) return;
        const remaining = 40 - elapsed;
        el.classList.remove("yellow", "red");
        if (remaining > 20) {
          el.textContent = remaining;
        } else if (remaining >= 0) {
          el.classList.add("yellow");
          el.textContent = remaining;
        } else {
          el.classList.add("red");
          el.textContent = "+" + Math.abs(remaining);
        }
      };
      update();
      trafficLightInterval = setInterval(() => { elapsed += 1; update(); }, 1000);
    }

    if (idx < 0) {
      document.getElementById("beginBtn").addEventListener("click", async () => {
        await updateDoc(doc(db, "live_runs", code), { currentTrackIndex: 0, status: "active", startedAt: Date.now() });
        renderLiveControl(code);
      });
    } else if (idx < TOTAL_PIECES - 1) {
      document.getElementById("nextBtn").addEventListener("click", async () => {
        clearInterval(trafficLightInterval);
        await updateDoc(doc(db, "live_runs", code), { currentTrackIndex: idx + 1 });
        renderLiveControl(code);
      });
    } else {
      document.getElementById("finishBtn").addEventListener("click", async () => {
        clearInterval(trafficLightInterval);
        await updateDoc(doc(db, "live_runs", code), { status: "finished" });
        renderLiveControl(code);
      });
    }
  }

  /* ============================================
     RESULTS REVIEW & POST TO LEADERBOARD
     ============================================ */
  function norm(s){
    return (s || "").trim().toLowerCase().replace(/\s+/g, " ")
      .replace(/[\u2018\u2019\u02bc]/g, "'")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function levenshtein(a, b){
    const m = a.length, n = b.length;
    const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++){
      for (let j = 1; j <= n; j++){
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
    }
    return dp[m][n];
  }

  // Matches UIL's own scoring standard: full credit for exact, half credit
  // for "correct but misspelled" (approximated via edit distance), zero
  // for wrong or blank.
  function gradeMatch(guessRaw, truthRaw){
    const guess = norm(guessRaw), truth = norm(truthRaw);
    if (truth === "") return guess === "" ? 1 : 0;
    if (guess === "") return 0;
    if (guess === truth) return 1;
    const dist = levenshtein(guess, truth);
    const threshold = Math.max(1, Math.round(truth.length * 0.2));
    return dist <= threshold ? 0.5 : 0;
  }

  function slugFor(firstName, grade, school){
    const clean = s => (s || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return `${clean(firstName)}_${clean(grade)}_${clean(school)}`;
  }

  async function renderResultsReview(code, run, template, pieces){
    const content = document.getElementById("tabContent");
    content.innerHTML = `<div class="card"><p class="status-msg">Loading responses\u2026</p></div>`;

    const responsesSnap = await getDocs(collection(db, "live_runs", code, "responses"));
    const responses = [];
    responsesSnap.forEach(d => responses.push({ id: d.id, ...d.data() }));

    const graded = responses.map(r => {
      let total = 0;
      const perTrack = template.order.map((pieceId, i) => {
        const truth = pieces[pieceId];
        const ans = (r.answers && r.answers[i]) || {};
        const composerCredit = gradeMatch(ans.composer, truth.composer);
        const majorCredit = gradeMatch(ans.majorWork, truth.majorWork);
        const selCredit = gradeMatch(ans.selectionTitle, truth.selectionTitle || "");
        const composerOk = composerCredit === 1, majorOk = majorCredit === 1, selOk = selCredit === 1;
        let trackScore = (composerCredit + majorCredit + selCredit) * OFFICIAL_POINTS_PER_FIELD;
        trackScore = Math.ceil(trackScore);
        total += trackScore;
        return { composerOk, majorOk, selOk, composerCredit, majorCredit, selCredit, trackScore };
      });
      return { ...r, perTrack, totalScore: total };
    });
    graded.sort((a, b) => b.totalScore - a.totalScore);

    content.innerHTML = `
      <div class="card">
        <h2 class="section-title">${run.label} \u2014 Results</h2>
        ${graded.length === 0 ? `<p class="status-msg">No submissions yet.</p>` : graded.map((g, gi) => `
          <div class="results-row" data-slug="${slugFor(g.firstName, g.grade, g.school)}" style="flex-wrap:wrap;">
            <div style="flex-grow:1;">
              <strong>${g.firstName || "(no name)"}</strong> \u2014 ${g.grade || "?"} \u00b7 ${g.school || "?"}
              <div style="font-size:0.78rem;color:#8a7a63;">${g.perTrack.filter(t => t.trackScore === 100).length}/${TOTAL_PIECES} tracks perfect</div>
            </div>
            <div class="score">${g.totalScore}</div>
            <button class="btn small secondary" data-action="toggle-details" data-idx="${gi}">View Details</button>
            <label style="display:flex; align-items:center; gap:5px; font-size:0.82rem; color:#8a7a63;">
              <input type="checkbox" data-action="approve-check" data-idx="${gi}"> Approved
            </label>
            <button class="btn small" data-action="post" disabled data-idx="${gi}" data-firstname="${g.firstName}" data-grade="${g.grade}" data-school="${g.school}" data-score="${g.totalScore}" data-time="${g.completionMs || 0}">Post to Leaderboard</button>
            <div class="detail-panel" id="detail-${gi}" style="display:none; width:100%; margin-top:10px; padding-top:10px; border-top:1px dashed rgba(18,35,65,0.15);">
              ${template.order.map((pieceId, i) => {
                const truth = pieces[pieceId];
                const ans = (g.answers && g.answers[i]) || {};
                const t = g.perTrack[i];
                const allOk = t.composerOk && t.majorOk && t.selOk;
                return `
                  <div style="padding:6px 0; font-size:0.85rem; border-bottom:1px solid rgba(18,35,65,0.06);">
                    <span class="${allOk ? 'mark correct' : 'mark incorrect'}">${allOk ? "\u2713" : "\u2717"}</span>
                    Track ${i + 1}: <strong>${truth.composer}</strong> \u2014 ${truth.majorWork}${truth.selectionTitle ? ` (${truth.selectionTitle})` : ""}
                    ${!allOk ? `
                      <div style="color:var(--bad); margin-top:2px; font-size:0.8rem;">
                        ${!t.composerOk ? `Composer: wrote "${ans.composer || "(blank)"}"${t.composerCredit === 0.5 ? " (misspelled \u2014 half credit)" : ""}<br>` : ""}
                        ${!t.majorOk ? `Major Work: wrote "${ans.majorWork || "(blank)"}"${t.majorCredit === 0.5 ? " (misspelled \u2014 half credit)" : ""}<br>` : ""}
                        ${!t.selOk ? `Selection Title: wrote "${ans.selectionTitle || "(blank)"}"${t.selCredit === 0.5 ? " (misspelled \u2014 half credit)" : ""}` : ""}
                      </div>
                    ` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `).join("")}
      </div>
      <button class="btn secondary" id="backBtn">Back to Runs</button>
      <p class="status-msg" id="postStatus"></p>
    `;
    document.getElementById("backBtn").addEventListener("click", () => { activeRunCode = null; renderRunsTab(); });

    content.querySelectorAll('[data-action="toggle-details"]').forEach(btn => {
      btn.addEventListener("click", () => {
        const panel = document.getElementById(`detail-${btn.dataset.idx}`);
        const showing = panel.style.display !== "none";
        panel.style.display = showing ? "none" : "block";
        btn.textContent = showing ? "View Details" : "Hide Details";
      });
    });

    content.querySelectorAll('[data-action="approve-check"]').forEach(cb => {
      cb.addEventListener("change", () => {
        const postBtn = content.querySelector(`[data-action="post"][data-idx="${cb.dataset.idx}"]`);
        if (postBtn) postBtn.disabled = !cb.checked;
      });
    });

    content.querySelectorAll('[data-action="post"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        const statusEl = document.getElementById("postStatus");
        const firstName = btn.dataset.firstname, grade = btn.dataset.grade, school = btn.dataset.school;
        const score = Number(btn.dataset.score), timeMs = Number(btn.dataset.time);
        if (!firstName || !grade || !school) { statusEl.textContent = "Missing name/grade/school for this student — can't post."; return; }
        const slug = slugFor(firstName, grade, school);
        statusEl.textContent = "Posting\u2026";
        try {
          const existing = await getDoc(doc(db, "leaderboard_approved", slug));
          const prevBest = existing.exists() ? existing.data().liveBestScore : undefined;
          const finalScore = Math.max(score, prevBest ?? -1);

          if (prevBest === undefined || score > prevBest) {
            await setDoc(doc(db, "leaderboard_approved", slug), {
              firstName, grade, school, liveBestScore: score, liveBestCompletionMs: timeMs, updatedAt: Date.now()
            }, { merge: true });
          }

          // Rank against every approved student's current Live score,
          // including this student's own just-confirmed best.
          const allApprovedSnap = await getDocs(collection(db, "leaderboard_approved"));
          let higherCount = 0;
          allApprovedSnap.forEach(d => {
            const other = d.data();
            if (d.id === slug) return;
            if (typeof other.liveBestScore === "number" && other.liveBestScore > finalScore) higherCount++;
          });
          const rank = higherCount + 1;

          await updateDoc(doc(db, "live_runs", code), {
            lastAnnouncement: { firstName, grade, school, score: finalScore, rank, timestamp: Date.now() }
          });

          statusEl.textContent = prevBest !== undefined && score <= prevBest
            ? `Re-announced ${firstName}'s best score of ${finalScore} (rank ${rank}) on the display.`
            : `Posted ${firstName}'s score of ${finalScore} (rank ${rank}) and announced it on the display.`;
        } catch (err) {
          statusEl.textContent = "Couldn't post: " + err.message;
        }
      });
    });
  }
</script>
