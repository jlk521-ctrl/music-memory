<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Live Test — Music Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#122341; --navy-deep:#0a1526; --navy-text:#1d5099;
    --parchment:#f2efe6; --parchment-dim:#e6e0cf; --orange:#d97e2c; --orange-bright:#f0b83e;
    --ink:#1c1712; --accent-muted:#8a5a2b; --good:#2f6b4a; --bad:#b3402f;
    --display:'Fraunces', serif; --body:'Libre Caslon Text', serif;
  }
  *{ box-sizing:border-box; }
  html{ color-scheme:light; }
  body{ margin:0; background:var(--parchment); color:var(--ink); font-family:var(--body); line-height:1.5; }
  button{ font-family:var(--body); cursor:pointer; }
  input, select{ font-family:var(--body); }

  .hero{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--parchment); padding:44px 24px; text-align:center;
  }
  .hero h1{ font-family:var(--display); font-style:italic; font-weight:600; margin:0 0 6px; font-size:2rem; }
  .hero p{ margin:0; color:rgba(241,231,208,0.78); font-size:0.92rem; }

  main{ max-width:820px; margin:0 auto; padding:32px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(18,35,65,0.12); border-radius:6px; padding:22px; margin-bottom:20px; box-shadow:0 14px 30px -18px rgba(0,0,0,0.25); }
  .btn{ background:var(--navy); color:var(--parchment); border:none; padding:12px 26px; border-radius:30px; font-size:0.95rem; }
  .btn:hover{ background:var(--navy-deep); }
  .btn:disabled{ opacity:0.5; cursor:default; }

  .join-card{ max-width:360px; margin:40px auto; text-align:center; }
  .join-card input{ width:100%; padding:12px; margin-bottom:12px; border:1px solid rgba(18,35,65,0.25); border-radius:4px; font-size:1.2rem; text-align:center; text-transform:uppercase; letter-spacing:0.15em; }

  .id-card{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .id-card input, .id-card select{ flex:1; min-width:140px; padding:10px; border:1px solid rgba(18,35,65,0.25); border-radius:4px; }

  .status-banner{ text-align:center; font-family:var(--display); font-style:italic; color:var(--navy-text); font-size:1.1rem; margin-bottom:6px; }
  .sync-status{ text-align:center; font-size:0.78rem; color:#8a7a63; margin-bottom:20px; }
  .sync-status.offline{ color:var(--bad); }

  .track-block{ padding:16px 0; border-bottom:1px solid rgba(18,35,65,0.1); }
  .track-block:last-child{ border-bottom:none; }
  .track-block .num{ font-family:var(--display); font-style:italic; color:var(--orange); font-size:1.15rem; margin-bottom:8px; display:block; }
  .track-block .fields{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  @media (max-width:640px){ .track-block .fields{ grid-template-columns:1fr; } }
  .track-block label{ display:block; font-size:0.75rem; color:var(--accent-muted); font-weight:700; margin-bottom:4px; }
  .track-block input{ width:100%; padding:8px; border:1px solid rgba(18,35,65,0.25); border-radius:4px; background:var(--parchment); }

  .submit-bar{ text-align:center; margin-top:20px; }
  .submitted-banner{ text-align:center; font-family:var(--display); font-style:italic; color:var(--good); font-size:1.3rem; padding:30px; }

  footer{ background:var(--navy-deep); color:rgba(241,231,208,0.6); text-align:center; padding:24px; font-size:0.85rem; }
</style>
</head>
<body>

<header class="hero">
  <h1>Live Test</h1>
  <p>Listen along with the room, then fill in what you remember below.</p>
</header>

<main id="app"></main>

<footer>UIL A+ Music Memory &middot; Live Test</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { initializeFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC1buaseorV5ZMvicSbYrzx3tz7_tos_wQ",
    authDomain: "music-memory-490d4.firebaseapp.com",
    projectId: "music-memory-490d4",
    storageBucket: "music-memory-490d4.firebasestorage.app",
    messagingSenderId: "669104332511",
    appId: "1:669104332511:web:6e15026013e67de445536a"
  };
  const app = initializeApp(firebaseConfig);
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

  const TOTAL_PIECES = 10;
  const GRADE_OPTIONS = ["2nd Grade", "3rd Grade", "4th Grade", "5th Grade", "Teacher"];
  const SCHOOL_OPTIONS = [
    "Belaire", "Bonham", "Bowie", "Bradford", "Crockett", "Fannin",
    "Fort Concho", "Glenmore", "Goliad", "Holiman", "Lamar",
    "McGill", "Reagan", "San Jacinto", "Santa Rita"
  ];

  const appEl = document.getElementById("app");

  /* ============================================
     LOCAL STORAGE — the source of truth for "did I lose my answer"
     ============================================ */
  function localKey(code, studentId){ return `liveTest_${code}_${studentId}`; }

  function loadLocal(code, studentId){
    try {
      const raw = localStorage.getItem(localKey(code, studentId));
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function saveLocal(code, studentId, data){
    try { localStorage.setItem(localKey(code, studentId), JSON.stringify(data)); }
    catch (e) { /* storage full or unavailable — nothing more we can do client-side */ }
  }

  function getOrCreateStudentId(code){
    const key = `liveTestStudentId_${code}`;
    let id = localStorage.getItem(key);
    if (!id) {
      id = "s" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(key, id);
    }
    return id;
  }

  /* ============================================
     JOIN SCREEN
     ============================================ */
  renderJoin();

  function renderJoin(){
    appEl.innerHTML = `
      <div class="card join-card">
        <h2 style="font-family:var(--display);font-style:italic;color:var(--navy-text);">Enter Join Code</h2>
        <input type="text" id="joinCode" placeholder="ABCDE" maxlength="8">
        <button class="btn" id="joinBtn" style="width:100%;">Join</button>
        <p class="sync-status" id="joinStatus"></p>
      </div>
    `;
    document.getElementById("joinBtn").addEventListener("click", attemptJoin);
    document.getElementById("joinCode").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptJoin(); });
  }

  async function attemptJoin(){
    const code = document.getElementById("joinCode").value.trim().toUpperCase();
    const statusEl = document.getElementById("joinStatus");
    if (!code) { statusEl.textContent = "Enter the code your teacher gave you."; return; }
    statusEl.textContent = "Joining\u2026";
    try {
      const runSnap = await getDoc(doc(db, "live_runs", code));
      if (!runSnap.exists()) { statusEl.textContent = "That code wasn't found. Check with your teacher."; return; }
      enterTest(code);
    } catch (err) {
      statusEl.textContent = "Couldn't join: " + err.message;
    }
  }

  /* ============================================
     THE TEST ITSELF
     ============================================ */
  function enterTest(code){
    const studentId = getOrCreateStudentId(code);
    let local = loadLocal(code, studentId) || {
      firstName: "", grade: "", school: "",
      answers: Array.from({length: TOTAL_PIECES}, () => ({ composer: "", majorWork: "", selectionTitle: "" })),
      submitted: false, completionMs: null
    };

    let currentTrackIndex = -1;
    let lastTrackPlayedAt = null;
    let lastSyncedAt = 0;
    let syncTimer = null;

    // Real-time listener — updates the "now playing" indicator as the
    // teacher advances tracks, and detects when the run closes.
    const unsubscribe = onSnapshot(doc(db, "live_runs", code), (snap) => {
      if (!snap.exists()) return;
      const run = snap.data();
      currentTrackIndex = run.currentTrackIndex;
      lastTrackPlayedAt = run.lastTrackPlayedAt || null;
      const badge = document.getElementById("trackBadgeText");
      if (badge) {
        badge.textContent = run.status === "finished"
          ? "Testing closed by your teacher"
          : currentTrackIndex >= 0 ? `Now on Track ${currentTrackIndex + 1} of ${TOTAL_PIECES}` : "Waiting for your teacher to begin\u2026";
      }
      const submitBtn = document.getElementById("submitBtn");
      if (submitBtn && run.status === "finished" && !local.submitted) {
        submitBtn.textContent = "Testing closed \u2014 Submit Now";
      }
    });

    render();

    function render(){
      if (local.submitted) {
        appEl.innerHTML = `<div class="card submitted-banner">Answers submitted! You can close this page.</div>`;
        return;
      }

      appEl.innerHTML = `
        <div class="card">
          <p class="status-banner" id="trackBadgeText">Waiting for your teacher to begin\u2026</p>
          <p class="sync-status" id="syncStatus">Answers save to this device automatically.</p>
          <div class="id-card">
            <input type="text" id="firstName" placeholder="First name" value="${local.firstName}">
            <select id="grade">
              <option value="">Grade\u2026</option>
              ${GRADE_OPTIONS.map(g => `<option value="${g}" ${local.grade === g ? "selected" : ""}>${g}</option>`).join("")}
            </select>
            <select id="school">
              <option value="">School\u2026</option>
              ${SCHOOL_OPTIONS.map(s => `<option value="${s}" ${local.school === s ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </div>
          ${Array.from({length: TOTAL_PIECES}, (_, i) => `
            <div class="track-block">
              <span class="num">${i + 1}.</span>
              <div class="fields">
                <div><label>Composer</label><input type="text" data-track="${i}" data-field="composer" value="${local.answers[i].composer}"></div>
                <div><label>Major Work</label><input type="text" data-track="${i}" data-field="majorWork" value="${local.answers[i].majorWork}"></div>
                <div><label>Selection Title</label><input type="text" data-track="${i}" data-field="selectionTitle" value="${local.answers[i].selectionTitle}"></div>
              </div>
            </div>
          `).join("")}
          <div class="submit-bar">
            <button class="btn" id="submitBtn">Submit Final Answers</button>
          </div>
        </div>
      `;

      document.getElementById("firstName").addEventListener("input", (e) => { local.firstName = e.target.value; onChange(); });
      document.getElementById("grade").addEventListener("change", (e) => { local.grade = e.target.value; onChange(); });
      document.getElementById("school").addEventListener("change", (e) => { local.school = e.target.value; onChange(); });
      appEl.querySelectorAll('input[data-track]').forEach(input => {
        input.addEventListener("input", () => {
          local.answers[input.dataset.track][input.dataset.field] = input.value;
          onChange();
        });
      });
      document.getElementById("submitBtn").addEventListener("click", submitFinal);
    }

    function onChange(){
      saveLocal(code, studentId, local);
      scheduleSync();
    }

    function scheduleSync(){
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncToFirestore, 1500); // debounce — don't hammer Firestore on every keystroke
    }

    async function syncToFirestore(){
      const statusEl = document.getElementById("syncStatus");
      try {
        await setDoc(doc(db, "live_runs", code, "responses", studentId), local, { merge: true });
        lastSyncedAt = Date.now();
        if (statusEl) { statusEl.textContent = "Saved to this device \u2014 and synced."; statusEl.classList.remove("offline"); }
      } catch (err) {
        if (statusEl) { statusEl.textContent = "Saved to this device \u2014 sync will retry (offline?)."; statusEl.classList.add("offline"); }
        scheduleSync(); // keep retrying quietly in the background
      }
    }

    async function submitFinal(){
      local.submitted = true;
      local.completionMs = lastTrackPlayedAt ? (Date.now() - lastTrackPlayedAt) : null;
      saveLocal(code, studentId, local);
      const btn = document.getElementById("submitBtn");
      if (btn) { btn.disabled = true; btn.textContent = "Submitting\u2026"; }
      try {
        await setDoc(doc(db, "live_runs", code, "responses", studentId), local, { merge: true });
      } catch (err) {
        // Local copy is already saved and marked submitted — safe to show
        // success; the periodic retry loop will finish the sync once the
        // connection returns, since local.submitted is already true here.
        scheduleSync();
      }
      render();
    }
  }
</script>

</body>
</html>
